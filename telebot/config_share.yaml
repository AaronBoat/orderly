telegram:
  # 从 @BotFather 获取的 Bot Token
  bot_token: "YOUR_BOT_TOKEN"
  
  # 源群组 ID（公告来源 - Forum）
  # 格式：-100xxxxxxxxxx（超级群组/频道/Forum）
  # 获取方法：将机器人加入群组后，转发群组消息给 @userinfobot
  source_chat_id: -1002011191127
  
  # 只监听特定的 Forum Topic（子频道）
  # 如果为空列表或不设置，则监听所有消息
  allowed_topics:
    - 100388
    - 1699
  
  # 目标群组 ID（中文群 - Group）
  target_chat_id: -1002266428094

gemini:
  # Google Gemini API Key
  # 获取地址：https://makersuite.google.com/app/apikey
  api_key: "YOUR_GEMINI_API_KEY"
  
  # 使用的模型名称
  model_name: "gemini-2.5-flash"

settings:
  language: "zh-CN"
  mode: "translate"
